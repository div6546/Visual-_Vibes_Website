<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Messages | Shiku Infra Pvt. Ltd.</title>
  <link rel="stylesheet" href="admin-messages.css" />
</head>
<body>
  <div class="container">
    <header class="header">
  <img src="img/shikulogo.png" alt="Shiku Infra Logo" class="logo" />
  <h1>Shiku Infra - Contact Messages</h1>
  <a href="admin-dashboard.html" class="back-btn">← Back to Dashboard</a>
</header>


    <div class="top-bar">
      <input type="text" id="searchInput" placeholder="🔍 Search messages..." />
      <button id="exportExcelBtn">📁 Export Excel</button>
    </div>

    <div class="table-wrapper">
      <table id="messagesTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Message</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="pagination">
      <button id="prevPage">Previous</button>
      <span id="pageNumber">Page 1</span>
      <button id="nextPage">Next</button>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <script src="admin-messages.js"></script>
</body>
</html>
